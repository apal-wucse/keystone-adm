\* Group C (region placement and PMP entry priority) on the design model.
\* A smaller configuration than ADM.cfg, since every placement of the
\* regions is enumerated.
SPECIFICATION SpecR

CONSTANTS
    Harts = {h1, h2}
    EIDs = {e1, e2}
    Zero = Zero
    Data = {Zero, d1}
    Meta = {d1}
    NoE = NoE
    NoH = NoH
    NoMeta = NoMeta
    Addr = {0, 1, 2, 3, 4}
    SMRegion = {0}

INVARIANTS
    TypeOK
    RegionTypeOK
    C1_RegionsDisjoint
    C_RegionsFollowLifecycle
    C2_SMNotShadowed
    C_EPMIsolated
    C_ADMPermFaithful
    A2_ExclusiveWhileRunning
    A3_OnlyExplicitGrant
    E1_NoUnintendedDisclosure
    B1_ValidatedBeforeRun
    B2_NoAccessDuringValidation
