\* Implementation model, every difference fixed (every Fix* TRUE).
\* Every property in one run, with three harts (`make check-impl`).
SPECIFICATION Spec
CONSTANTS
    Harts = {h1, h2, h3}
    EIDs = {e1}
    Data = {Zero, d1, d2}
    Zero = Zero
    Meta = {d1, d2}
    NSlots = 2
    Unused = Unused
    FixValidateFail = TRUE
    FixStaleMeta = TRUE
    FixNullRW = TRUE
    FixShareType = TRUE
    FixDestroyGuard = TRUE
    FixHartRestart = TRUE
    RestoreAt = "init_resend"
    FixNonRetSuspend = TRUE
    FixStopping = TRUE
INVARIANT TypeOK
INVARIANTS
    A1_InitialProtection A2_ExclusiveWhileRunning A3_OnlyExplicitGrant
    A6_IsolatedWhenNotShared A8_InvoluntaryStopSafe E1_NoUnintendedDisclosure
    B1_ValidatedBeforeRun B2_NoAccessDuringValidation B3_FailClosed
    B3_NeverRunsAgain B4_FreshMetadata E2_ContentsPreserved
    D2d_SingleRunner D3_SingleDestroyer
PROPERTIES
    A4_RevokedBeforeEnter A9_NoSecretAtRelease B5_EnterOnlyViaValidation
